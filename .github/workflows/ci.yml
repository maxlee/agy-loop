name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Test & Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check POSIX shell syntax
        run: sh -n install.sh uninstall.sh skills/loop/scripts/loop-helper.sh

      - name: Run test suite
        run: npm test

      - name: Verify npm package contents
        run: npm pack --dry-run
